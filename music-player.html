<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音乐播放器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <script>
    // Tailwind配置
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#5cf6e9',
            secondary: '#5cf680',
            glass: 'rgba(30, 41, 59, 0.6)',
            'glass-dark': 'rgba(15, 23, 42, 0.8)'
          }
        }
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .glass-effect {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .scrollbar-thin {
        scrollbar-width: thin;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 4px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: rgba(92, 246, 233, 0.5);
        border-radius: 2px;
      }
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen p-8">
  <!-- 音乐播放器容器 -->
  <div id="musicPlayer" class="glass-effect bg-glass dark:bg-glass-dark rounded-xl p-4 border border-white/10 dark:border-gray-700 shadow-lg w-64 mx-auto">
    <div class="flex justify-between items-center mb-3">
      <h3 class="font-bold text-white text-sm">背景音乐</h3>
      <button id="closeMusicPlayer" class="text-white/70 hover:text-white transition-colors">
        <i class="fa fa-times"></i>
      </button>
    </div>
    
    <div class="mb-3">
      <p id="currentMusic" class="text-white text-sm truncate">暮春</p>
      <div class="w-full h-1 bg-white/20 rounded-full mt-2 relative group">
        <div id="musicProgress" class="h-full bg-primary rounded-full" style="width: 30%"></div>
        <div id="progressHandle" class="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-primary rounded-full opacity-0 group-hover:opacity-100 transition-opacity" style="left: 30%"></div>
      </div>
    </div>
    
    <div class="flex justify-between items-center">
      <button id="prevMusic" class="text-white hover:text-primary transition-colors">
        <i class="fa fa-step-backward"></i>
      </button>
      <button id="toggleMusic" class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white hover:bg-primary/90 transition-colors">
        <i class="fa fa-pause"></i>
      </button>
      <button id="nextMusic" class="text-white hover:text-primary transition-colors">
        <i class="fa fa-step-forward"></i>
      </button>
    </div>
    
    <div class="mt-3 pt-3 border-t border-white/10">
      <h4 class="text-white/80 text-xs mb-2">播放列表</h4>
      <div id="musicPlaylist" class="max-h-40 overflow-y-auto text-sm scrollbar-thin">
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer bg-white/10">
          <i class="fa fa-music text-primary mr-2"></i>
          <span class="text-white truncate">暮春</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">星相运轨</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">鸟之诗</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">アイロニ - majiko（反语）</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">Call of silence（钢琴版） - Yi Chou</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">In The End（钢琴版） - 刘匠</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer" data-music="时落之雨" data-rainy="true">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">时落之雨</span>
        </div>
        <div class="music-item flex items-center p-2 rounded hover:bg-white/10 cursor-pointer" data-music="雨之城" data-rainy="true">
          <i class="fa fa-music text-white/70 mr-2"></i>
          <span class="text-white/80 truncate">雨之城</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 音乐播放器按钮 -->
  <button id="musicToggleBtn" class="fixed bottom-4 right-4 z-40 bg-gray-800 text-primary p-3 rounded-full shadow-lg hover:bg-gray-700 transition-colors">
    <i class="fa fa-music"></i>
  </button>

  <!-- 音频元素 -->
  <audio id="bgMusic" loop>
    <source src="assents/mp3/暮春.mp3" type="audio/mpeg">
  </audio>

  <script>
    // 获取DOM元素
    const musicPlayer = document.getElementById('musicPlayer');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const closeMusicPlayer = document.getElementById('closeMusicPlayer');
    const toggleMusic = document.getElementById('toggleMusic');
    const prevMusic = document.getElementById('prevMusic');
    const nextMusic = document.getElementById('nextMusic');
    const musicProgress = document.getElementById('musicProgress');
    const progressHandle = document.getElementById('progressHandle');
    const currentMusic = document.getElementById('currentMusic');
    const musicItems = document.querySelectorAll('.music-item');
    const bgMusic = document.getElementById('bgMusic');
    
    // 显示/隐藏音乐播放器
    musicToggleBtn.addEventListener('click', () => {
      musicPlayer.classList.toggle('hidden');
    });
    
    closeMusicPlayer.addEventListener('click', () => {
      musicPlayer.classList.add('hidden');
    });
    
    // 播放/暂停音乐
    let isPlaying = true;
    toggleMusic.addEventListener('click', () => {
      if (isPlaying) {
        bgMusic.pause();
        toggleMusic.innerHTML = '<i class="fa fa-play"></i>';
      } else {
        bgMusic.play();
        toggleMusic.innerHTML = '<i class="fa fa-pause"></i>';
      }
      isPlaying = !isPlaying;
    });
    
    // 模拟音乐进度更新
    setInterval(() => {
      if (!isPlaying) return;
      
      const currentWidth = parseFloat(musicProgress.style.width);
      const newWidth = currentWidth >= 100 ? 0 : currentWidth + 0.1;
      
      musicProgress.style.width = `${newWidth}%`;
      progressHandle.style.left = `${newWidth}%`;
      
      // 进度完成时切换到下一首
      if (newWidth >= 100) {
        nextMusic.click();
      }
    }, 100);
    
    // 点击进度条调整进度
    musicProgress.parentElement.addEventListener('click', (e) => {
      const rect = musicProgress.parentElement.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width * 100;
      
      musicProgress.style.width = `${pos}%`;
      progressHandle.style.left = `${pos}%`;
    });
    
    // 选择音乐
    musicItems.forEach((item, index) => {
      item.addEventListener('click', () => {
        // 重置所有项目样式
        musicItems.forEach(i => {
          i.classList.remove('bg-white/10');
          i.querySelector('i').classList.remove('text-primary');
          i.querySelector('i').classList.add('text-white/70');
          i.querySelector('span').classList.remove('text-white');
          i.querySelector('span').classList.add('text-white/80');
        });
        
        // 设置当前项目样式
        item.classList.add('bg-white/10');
        item.querySelector('i').classList.remove('text-white/70');
        item.querySelector('i').classList.add('text-primary');
        item.querySelector('span').classList.remove('text-white/80');
        item.querySelector('span').classList.add('text-white');
        
        // 更新当前音乐标题
        currentMusic.textContent = item.querySelector('span').textContent;
        
        // 重置进度
        musicProgress.style.width = '0%';
        progressHandle.style.left = '0%';
        
        // 播放音乐
        if (!isPlaying) {
          toggleMusic.click();
        }
      });
    });
    
    // 上一首/下一首功能
    nextMusic.addEventListener('click', () => {
      const currentItem = document.querySelector('.music-item.bg-white/10');
      const currentIndex = Array.from(musicItems).indexOf(currentItem);
      const nextIndex = (currentIndex + 1) % musicItems.length;
      
      musicItems[nextIndex].click();
    });
    
    prevMusic.addEventListener('click', () => {
      const currentItem = document.querySelector('.music-item.bg-white/10');
      const currentIndex = Array.from(musicItems).indexOf(currentItem);
      const prevIndex = (currentIndex - 1 + musicItems.length) % musicItems.length;
      
      musicItems[prevIndex].click();
    });
  </script>
</body>
</html>
