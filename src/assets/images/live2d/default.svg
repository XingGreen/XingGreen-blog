<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400">
  <!-- 背景 -->
  <rect width="300" height="400" fill="#f0f8ff"/>
  
  <!-- 头发 -->
  <path d="M150 80 C100 80, 80 150, 80 200 C80 250, 120 300, 150 300 C180 300, 220 250, 220 200 C220 150, 200 80, 150 80 Z" fill="#333"/>
  
  <!-- 脸部 -->
  <circle cx="150" cy="180" r="60" fill="#ffdbac"/>
  
  <!-- 眼睛 -->
  <circle cx="130" cy="170" r="8" fill="#333"/>
  <circle cx="170" cy="170" r="8" fill="#333"/>
  <circle cx="130" cy="168" r="3" fill="white"/>
  <circle cx="170" cy="168" r="3" fill="white"/>
  
  <!-- 嘴巴 -->
  <path d="M140 200 Q150 210, 160 200" stroke="#ff6b6b" stroke-width="2" fill="none"/>
  
  <!-- 身体 -->
  <path d="M120 240 L180 240 L190 350 L110 350 Z" fill="#ff69b4"/>
  
  <!-- 手臂 -->
  <path d="M120 240 L100 300 L90 290" stroke="#ffdbac" stroke-width="15" fill="none"/>
  <path d="M180 240 L200 300 L210 290" stroke="#ffdbac" stroke-width="15" fill="none"/>
  
  <!-- 腿部 -->
  <path d="M135 350 L135 400" stroke="#333" stroke-width="10" fill="none"/>
  <path d="M165 350 L165 400" stroke="#333" stroke-width="10" fill="none"/>
</svg>